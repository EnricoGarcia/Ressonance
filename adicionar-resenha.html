<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Resenha - Ressonance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="btn-menu" aria-label="Abrir menu de navegação">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h1><a href="index.html">Ressonance</a></h1>
    </header>

    <div class="app-container">
        <!-- BARRA LATERAL -->
        <aside id="menu-lateral" class="fechado">
            <section class="perfil-usuario">
                <h2 class="sr-only">Informações do Utilizador</h2>
                <figure>
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                    </svg>
                    <figcaption><a href="meu-perfil.html" id="nome-perfil-sidebar" style="color: inherit; text-decoration: none;">Meu Perfil</a></figcaption>
                </figure>
            </section>
            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="minhas-resenhas.html">Suas Resenhas</a></li>
                    <li><a href="adicionar-resenha.html">Adicionar Resenha</a></li>
                </ul>
            </nav>
            <div class="menu-footer">
                <a href="#" id="btn-sair">Sair</a>
            </div>
        </aside>

       <main class="container-auth">
    <h2 class="perfil-titulo">Adicionar Resenha</h2>
    
    <div class="perfil-caixa-branca">
        <form id="form-resenha">
            
            <input type="text" id="nome-album" placeholder="Digite o nome do álbum" required>

            <div class="slider-container">
                <label for="nota">Barra de rolagem (0-5, passo 0.5)</label>
                <input type="range" id="nota" min="0" max="5" step="0.5" value="3.0" style="width: 80%;">
                <span id="valor-nota" style="font-weight: bold; margin-left: 10px;">3.0</span>
            </div>

            <textarea id="texto-resenha" placeholder="Digite a resenha do álbum" required rows="6" style="resize: vertical;"></textarea>
        </form>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <button type="submit" form="form-resenha" class="btn-submit">Enviar</button>
    </div>
</main>
    </div>

    <script src="barralat.js"></script>
    <script src="dados.js"></script>
    <script src="adicionar-resenha.js"></script>
</body>
</html>
